[project]
name = "silicon-market"
version = "0.0.1"
description = "Local-first Xianyu hardware price and listing observation system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "playwright>=1.50,<2",
  "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
